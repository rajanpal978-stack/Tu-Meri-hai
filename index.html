<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
    font-family:'Noto Serif Devanagari',serif;
    color:white;

    background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.72)),
    url("IMG_0794.jpeg");

    background-size: 100% 100%;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    width:100%;
    max-width:500px;
    padding:20px;
}
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.moon{
    font-size:45px;
    margin-bottom:20px;
}

.line{
    width:90px;
    height:1px;
    background:rgba(255,255,255,.45);
    margin:30px auto;
}

p{
    font-size:26px;
    line-height:1.9;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
}

.last{
    margin-top:35px;
    font-size:28px;
    font-weight:700;
}
</style>
</head>

<body>

<div class="container">

<div class="moon">🌙</div>

<div class="line"></div>

<p>
अपना ध्यान रखो,<br>
मेरे चाँद।
</p>

<br>

<p>
आप पहली थीं,<br>
जिनसे मिलकर मैं सच में<br>
खुलकर हँस सका।
</p>

<br>

<p>
बाकी सब तो<br>
मेरी बनाई हुई कहानियाँ थीं।
</p>

<br>

<p>
यह दुनिया नफ़रत और धोखों से<br>
भरी हुई है,<br>
और मुझे ऐसी दुनिया<br>
बिल्कुल पसंद नहीं।
</p>

<div class="line"></div>

<p class="last">
मिलते हैं…<br>
जब आप 🙃
</p>

</div>

</body>
</html>
